[package]
name = "vaelen-music"
version = "1.0.0"
description = "Vaelen Music - lx-music compatible music player"
authors = ["vaelen-music"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vaelen_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rfd = "0.15"
base64 = "0.22"
encoding_rs = "0.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
